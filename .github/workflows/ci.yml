name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/reconcile-engine/rust
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml in this dir pins the channel + clippy component;
      # rustup installs it automatically on first cargo invocation.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/reconcile-engine/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/reconcile-engine/rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo test
        run: cargo test
      - name: cargo clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: boundary bench (caller-thread gap vs engine)
        run: cargo bench --bench boundary
        env:
          # Proves the harness on every pull request. The 100k table in
          # BENCHMARKS.md is from a release run with the default row count.
          BENCH_ROWS: "2000"

  # Native artifacts are the thing a clean clone links. Building them here is
  # the gate that used to be "run the scripts on a laptop and hope". The
  # binaries are uploaded as workflow artifacts; they stay gitignored.
  android:
    name: Android ABIs (cargo-ndk)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager --install "ndk;27.2.12479018"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4
      - name: Build static libs
        working-directory: packages/reconcile-engine
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-rust
          path: packages/reconcile-engine/android-rust
          if-no-files-found: error

  ios:
    name: iOS xcframework
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build xcframework
        working-directory: packages/reconcile-engine
        run: ./scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: packages/reconcile-engine/ios-rust
          if-no-files-found: error

  js:
    name: TypeScript (tsc + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Engine package tests
        run: yarn test
        working-directory: packages/reconcile-engine
      - name: Sandbox typecheck
        run: npx tsc --noEmit
        working-directory: apps/sandbox
      - name: Sandbox bench tests
        run: yarn test
        working-directory: apps/sandbox

  # Native artifact builds (iOS xcframework / Android .a for all ABIs) need
  # macOS + Xcode / the Android NDK and are heavy; they are intentionally not
  # in the per-PR gate yet. Track adding a scheduled/opt-in native build job in
  # ROADMAP.md (CI section) alongside the artifact-distribution decision.
