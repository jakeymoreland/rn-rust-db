[package]
name = "reconcile_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"  # audit S26: floor for the FFI panic=abort-on-unwind behavior
description = "Offline-first reconcile engine: SQLite-backed store with field-level last-writer-wins merge, redis-style kv cache, and glob pub/sub, behind a C ABI."
license = "MIT"
repository = "https://github.com/jakeymoreland/rn-rust-db"
publish = false  # consumed via the RN package, not published to crates.io

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

# NOTE: do not enable LTO here. For a staticlib consumed by Apple's ld, both
# thin and fat LTO leave LLVM bitcode members in the archive, and Apple's
# linker (older LLVM than rustc's) fails on them with undefined symbols /
# "Unknown attribute kind" errors.
