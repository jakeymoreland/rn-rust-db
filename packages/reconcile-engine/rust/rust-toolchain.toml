# Pin the toolchain and the cross-compile targets so every machine (and CI)
# produces behaviorally identical static libraries from the same source
# (audit S26). Update deliberately, together with a rebuild of the committed
# artifacts and their manifest.
[toolchain]
channel = "1.95.0"
targets = [
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "i686-linux-android",
]
